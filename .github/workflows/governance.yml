# AgentGate 治理门禁 v1.3.0 (GitHub Actions)
#
# ┌──────────────────────────────────────────────────────────────┐
# │ 硬约束: 严格只扫 PR 增量 (base..HEAD), 任何情况都不全量扫描。      │
# │ - 只在 pull_request 触发, 用目标分支最新 tip 算 diff。            │
# │ - 不在 push 触发 (push 无 base, 会退化成不可控范围)。             │
# └──────────────────────────────────────────────────────────────┘
name: governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  # 风险扫描: 硬阻断
  risk-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml==6.0.3
      - name: scan risks
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描 (不允许全量回退)"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          python governance/scripts/scan_risks.py --diff-base "origin/$BASE_REF" --config governance.config.yml

  # 密钥扫描: 硬阻断
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (本次 PR 范围)
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --log-opts="origin/${BASE_REF}..HEAD" \
            --redact --no-banner --verbose

  # MR 描述校验: 硬门禁
  mr-validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml==6.0.3
      - name: validate PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          if [ -z "$PR_BODY" ]; then
            echo "## 背景" > /tmp/pr_body.txt
            echo "请填写 PR 背景" >> /tmp/pr_body.txt
            echo "" >> /tmp/pr_body.txt
            echo "## 变更内容" >> /tmp/pr_body.txt
            echo "请填写变更内容" >> /tmp/pr_body.txt
            echo "" >> /tmp/pr_body.txt
            echo "## 自测确认" >> /tmp/pr_body.txt
            echo "[ ] 已完成自测" >> /tmp/pr_body.txt
            python governance/scripts/validate_mr.py --diff-base "origin/$BASE_REF" --config governance.config.yml --file /tmp/pr_body.txt
          else
            printf '%s' "$PR_BODY" \
              | python governance/scripts/validate_mr.py --diff-base "origin/$BASE_REF" --config governance.config.yml
          fi

  # 测试痕迹检测: 硬门禁
  test-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml==6.0.3
      - name: check tested
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          python governance/scripts/check_tested.py --diff-base "origin/$BASE_REF" --config governance.config.yml

  # Python 测试: 无 requirements.txt / pyproject.toml / setup.py 时跳过
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: run python tests
        env:
          GOVERNANCE_SKIP_PYTHON_TEST: ${{ vars.GOVERNANCE_SKIP_PYTHON_TEST }}
        run: |
          if [ "${GOVERNANCE_SKIP_PYTHON_TEST}" = "true" ]; then exit 0; fi
          DIRS=$(find . -maxdepth 3 \( -name "requirements.txt" -o -name "pyproject.toml" -o -name "setup.py" \) \
                 -not -path "*/.*" -not -path "*/node_modules/*" -not -path "*/governance/scripts/*" | xargs -I{} dirname {} | sort -u)
          if [ -z "$DIRS" ]; then echo "[python-test] 未找到 Python 项目标记文件, 跳过。"; exit 0; fi
          pip install -q pytest pyyaml
          OVERALL=0
          for DIR in $DIRS; do
            echo "[python-test] 在 $DIR 运行 pytest"
            (
              cd "$DIR"
              [ -f requirements.txt ] && pip install -q -r requirements.txt
              [ -f pyproject.toml ] && pip install -q -e ".[test]" 2>/dev/null || true
              python -m pytest --tb=short -q
            ) || OVERALL=1
          done
          exit $OVERALL

  # Node.js/TypeScript 测试: 无 package.json 时跳过
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: run node tests
        env:
          GOVERNANCE_SKIP_NODE_TEST: ${{ vars.GOVERNANCE_SKIP_NODE_TEST }}
        run: |
          if [ "${GOVERNANCE_SKIP_NODE_TEST}" = "true" ]; then exit 0; fi
          DIRS=$(find . -maxdepth 3 -name "package.json" \
                 -not -path "*/node_modules/*" -not -path "*/.*" | xargs -I{} dirname {} | sort -u)
          if [ -z "$DIRS" ]; then echo "[node-test] 未找到 package.json, 跳过。"; exit 0; fi
          OVERALL=0
          for DIR in $DIRS; do
            echo "[node-test] 在 $DIR 运行 npm test"
            (
              cd "$DIR"
              if ! node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
                echo "[node-test] $DIR has no test script, skipping."
                exit 0
              fi
              npm ci --prefer-offline --no-audit 2>/dev/null || npm install --no-audit
              npm test
            ) || OVERALL=1
          done
          exit $OVERALL

  # 自测: 跑 governance 脚本自己的回归套件
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml==6.0.3
      - name: run selftest
        run: bash governance/scripts/selftest.sh

  # GateResult 汇总器: 只有该 job 成功后 Merge Bot 才能自动合并
  gate-decision:
    needs: [risk-scan, secret-scan, mr-validate, test-check, python-test, node-test, selftest]
    if: github.event.pull_request.draft == false
    outputs:
      merge_action: ${{ steps.compute.outputs.merge_action }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml==6.0.3
      - name: compute GateResult
        id: compute
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE_REF"
          git cat-file -e "$HEAD_SHA^{commit}"
          SOURCE_SHA="$HEAD_SHA"
          POLICY_SHA="$(git rev-parse "${SOURCE_SHA}:governance.config.yml")"
          cat > /tmp/agentgate-evidence.json <<'JSON'
          {"schema_version":"v1","checks":{"risk-scan":"pass","secret-scan":"pass","mr-validate":"pass","test-check":"pass","selftest":"pass"}}
          JSON
          set +e
          python governance/scripts/gate_decision.py \
            --evidence /tmp/agentgate-evidence.json \
            --source-sha "$SOURCE_SHA" \
            --target-sha "$BASE_SHA" \
            --policy-sha "$POLICY_SHA" \
            --diff-base "origin/$BASE_REF" \
            --config governance.config.yml \
            --output gate-result.json
          DECISION_EXIT=$?
          set -e
          if [ "$DECISION_EXIT" -gt 1 ]; then
            echo "GateResult 计算错误，拒绝继续。"
            exit "$DECISION_EXIT"
          fi
          MERGE_ACTION="$(python -c 'import json; print(json.load(open("gate-result.json", encoding="utf-8"))["merge_action"])')"
          echo "merge_action=$MERGE_ACTION" >> "$GITHUB_OUTPUT"
          echo "GateResult:"; cat gate-result.json

  # Merge Bot: 只在 GateResult == AUTO_MERGE 时启用平台自动合并
  auto-merge:
    needs: [gate-decision]
    if: >-
      needs.gate-decision.result == 'success' &&
      needs.gate-decision.outputs.merge_action == 'AUTO_MERGE' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --delete-branch
