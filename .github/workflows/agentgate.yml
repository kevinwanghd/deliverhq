name: AgentGate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# auto-merge 任务需要 contents: write（enablePullRequestAutoMerge）；
# 可复用工作流的 GITHUB_TOKEN 权限不得超过此处上限。源头修复：AgentGate#84
permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  agentgate:
    uses: kevinwanghd/AgentGate/.github/workflows/agentgate.yml@github-stable
    secrets: inherit
    with:
      config-path: governance.config.yml
      agentgate-repository: kevinwanghd/AgentGate
      agentgate-ref: github-stable
