# 把下面的 include 加入 .gitlab-ci.yml:
#
# include:
#   - local: '/governance/ci-snippet.yml'
#
# governance job 在 test 阶段之前运行, diff-only, 秒级返回。
# 如需自动合并, 在 GitLab CI/CD Variables 配置受保护/Masked 的 GOVERNANCE_MERGE_BOT_TOKEN。

stages:
  - governance
  - test
  - build
  - merge

# 风险扫描: 硬阻断 (命中风险模式且缺合法注解 → 拒合)
governance:risk-scan:
  stage: governance
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  before_script:
    - pip install -q pyyaml==6.0.3
  script:
    - |
      # 用目标分支最新 tip 作 base (而非 MR 创建时的旧快照), 否则 merge 进来的
      # 他人改动会被误算进本次 diff。三点 diff 自动取 merge-base。
      TB="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      git fetch -q origin "$TB"
      python governance/scripts/scan_risks.py --diff-base "origin/$TB"
  allow_failure: false

# 密钥扫描: 硬阻断 (本次 MR 引入的提交里出现密钥/凭据 → 拒合)
# 用官方 gitleaks 镜像, 只扫本次 MR 范围 (base..HEAD), 不扫历史全量。
governance:secret-scan:
  stage: governance
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  variables:
    GIT_DEPTH: 0          # 需要完整历史以便按范围扫描
  script:
    - |
      TB="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      git fetch -q origin "$TB"
      # 只扫本次 MR 引入的提交; 命中任一密钥 gitleaks 返回非 0
      gitleaks detect \
        --source . \
        --log-opts="origin/${TB}..HEAD" \
        --redact \
        --no-banner \
        --verbose
  allow_failure: false

# MR 描述校验: v1 软模式 (缺字段只警告, soft_deadline 后由脚本读 config 自动转硬)
governance:mr-validate:
  stage: governance
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0          # 需完整历史以读取 commit 里的 AI-Usage trailer
  before_script:
    - pip install -q pyyaml==6.0.3
  script:
    - |
      TB="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      git fetch -q origin "$TB"
      echo "$CI_MERGE_REQUEST_DESCRIPTION" \
        | python governance/scripts/validate_mr.py --diff-base "origin/$TB"
  # 软模式期内脚本自身返回 0; deadline 过后脚本返回 1, 此时该 job 才真正阻断。
  # allow_failure 设 false 以便 deadline 后生效; 软模式期脚本不会 fail。
  allow_failure: false

# 测试痕迹检测: 改动的生产代码是否做过测试 (v1 软; 但失败测试记录无条件硬拦)
# CI 看不到 .governance/ 证据 (gitignore), 退回读 commit 的 Tested: trailer。
governance:test-check:
  stage: governance
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  variables:
    GIT_DEPTH: 0          # 需完整历史以读取 commit 里的 Tested: trailer
  before_script:
    - pip install -q pyyaml==6.0.3
  script:
    - |
      TB="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      git fetch -q origin "$TB"
      python governance/scripts/check_tested.py --diff-base "origin/$TB"
  # 软模式期脚本对"未测"仅警告返回 0; 但"失败测试记录"始终返回 1 硬拦。
  allow_failure: false

# 过期注解周报: 仅报告, 不阻断 (定时或手动触发)
# 在 GitLab → CI/CD → Schedules 里新建每周一 08:00 的定时 pipeline 即可自动运行。
governance:expired-report:
  stage: governance
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  before_script:
    - pip install -q pyyaml==6.0.3
  script:
    - |
      python governance/scripts/report_expired.py \
        --root . \
        --output governance/reports/expired-annotations.md
  artifacts:
    paths:
      - governance/reports/
    expire_in: 30 days
  allow_failure: true

# Go 受影响包测试 (含反向依赖一跳扩展); 非 Go 仓库 (无 go.mod) 自动跳过
# 需要在 CI runner 上有 golang 环境; 或使用 image: golang:1.22-bookworm
governance:go-test:
  stage: test
  image: golang:1.22-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $GOVERNANCE_SKIP_GO_TEST != "true"
    - if: $CI_COMMIT_BRANCH && $GOVERNANCE_SKIP_GO_TEST != "true"
  variables:
    GIT_DEPTH: 0
    GOFLAGS: "-mod=mod"
  before_script:
    - pip install -q pyyaml==6.0.3 2>/dev/null || python3 -m pip install -q pyyaml==6.0.3
  script:
    - |
      if [ ! -f go.mod ]; then
        echo "[go-test] 未找到 go.mod, 跳过 Go 测试。"
        exit 0
      fi
      TB="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      git fetch -q origin "$TB"
      python3 governance/scripts/run_affected_tests.py \
        --diff-base "origin/$TB" \
        --timeout "${GOVERNANCE_GO_TEST_TIMEOUT:-120}"
  allow_failure: false

# GateResult 决策: 汇总 CI 独立证据, 不直接合并
governance:gate-decision:
  stage: test
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0
  dependencies:
    - governance:risk-scan
    - governance:secret-scan
    - governance:mr-validate
    - governance:test-check
    - governance:go-test
  before_script:
    - pip install -q pyyaml==6.0.3
  script:
    - |
      TB="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      git fetch -q origin "$TB"
      SOURCE_SHA="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
      TARGET_SHA="${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-$(git rev-parse "origin/$TB")}"
      CONFIG_PATH="${GOVERNANCE_CONFIG_PATH:-governance.config.yml}"
      [ -f "$CONFIG_PATH" ] || CONFIG_PATH="governance/governance.config.yml"
      POLICY_SHA="$(git rev-parse "${SOURCE_SHA}:${CONFIG_PATH}" 2>/dev/null || echo "$SOURCE_SHA")"
      python - <<'PY' > gate-evidence.json
      import json
      checks = {
          "risk-scan": "pass",
          "secret-scan": "pass",
          "mr-validate": "pass",
          "test-check": "pass",
          "go-test": "pass",
      }
      print(json.dumps({"checks": checks}, ensure_ascii=False))
      PY
      set +e
      python governance/scripts/gate_decision.py \
        --evidence gate-evidence.json \
        --source-sha "$SOURCE_SHA" \
        --target-sha "$TARGET_SHA" \
        --policy-sha "$POLICY_SHA" \
        --diff-base "origin/$TB" \
        --config "$CONFIG_PATH" \
        --output gate-result.json
      DECISION_EXIT=$?
      set -e
      if [ "$DECISION_EXIT" -gt 1 ]; then
        exit "$DECISION_EXIT"
      fi
  artifacts:
    paths:
      - gate-result.json
    expire_in: 30 days
  allow_failure: false

# Merge Bot: 仅消费 GateResult, 使用独立 token 设置 GitLab 自动合并
governance:auto-merge:
  stage: merge
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  dependencies:
    - governance:gate-decision
  script:
    - |
      python - <<'PY'
      import json
      import os
      import sys
      import urllib.parse
      import urllib.request

      with open("gate-result.json", encoding="utf-8") as f:
          gate = json.load(f)

      action = gate.get("merge_action", "BLOCK")
      result = gate.get("result", "FAIL")
      if action != "AUTO_MERGE":
          print(f"[auto-merge] GateResult={result}, action={action}; skip.")
          raise SystemExit(0)

      if os.getenv("CI_MERGE_REQUEST_SOURCE_PROJECT_ID", os.getenv("CI_PROJECT_ID")) != os.getenv("CI_PROJECT_ID"):
          print("[auto-merge] fork/source-project MR is not eligible for bot merge.")
          raise SystemExit(0)

      token = os.getenv("GOVERNANCE_MERGE_BOT_TOKEN")
      if not token:
          print("[auto-merge] GOVERNANCE_MERGE_BOT_TOKEN is required for GitLab auto merge.", file=sys.stderr)
          raise SystemExit(1)

      api = "{}/projects/{}/merge_requests/{}/merge".format(
          os.environ["CI_API_V4_URL"].rstrip("/"),
          os.environ["CI_PROJECT_ID"],
          os.environ["CI_MERGE_REQUEST_IID"],
      )
      data = urllib.parse.urlencode({
          "merge_when_pipeline_succeeds": "true",
          "squash": "true",
          "should_remove_source_branch": "true",
          "sha": os.getenv("CI_MERGE_REQUEST_SOURCE_BRANCH_SHA", os.getenv("CI_COMMIT_SHA", "")),
      }).encode()
      req = urllib.request.Request(api, data=data, method="PUT", headers={"PRIVATE-TOKEN": token})
      with urllib.request.urlopen(req, timeout=30) as resp:
          print(resp.read().decode("utf-8", errors="replace"))
      PY
  allow_failure: false
