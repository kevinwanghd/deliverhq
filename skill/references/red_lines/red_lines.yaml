# Red Lines — AI 行为红线单一真源
# 来源：企业微信团队"AI代码生成率94%"经验
# 版本：v1.0
# 维护：与 governance.config.yml 保持同步

# =============================================================================
# 核心原则
# =============================================================================
# LLM "什么都敢说，什么都敢做"——用 YAML 红线给它戴紧箍。
#
# 红线分两级：
#   critical：全流程必守，启动即加载，违反直接造成线上事故
#   standard：按阶段加载，违反污染工程规范
#
# 触发即停 + 模板化报告：
#   ⛔ 触发红线 RL-XX：<标题>
#   当前情形：<具体说明>
#   建议处理：<回退到哪个步骤 / 需要用户确认什么>
# =============================================================================

red_lines:
  critical:
    - id: RL-C01
      title: 编译必须通过
      description: "bazel build / flutter build / npm run build 退出码 0 是唯一判据"
      enforcement: fail_closed
      max_self_fix: 3
      note: "AI 报'完成'但编译没过 = 失败；自修复超过 3 轮仍不过强制停下"
      examples:
        - "npm run build 退出码 1"
        - "flutter build apk 编译错误"
        - "bazel build 链接失败"

    - id: RL-C02
      title: 未按阶段执行
      description: "后一阶段输入必须等于前一阶段产出，禁止跳过阶段"
      enforcement: fail_closed
      note: "顺序：设计稿→拆解→定位→实现→验证→模拟器→沉淀→提交"
      examples:
        - "用户一句话指令 → AI 跳过拆解直接改代码 → 越界"

    - id: RL-C03
      title: 先看后写
      description: "禁止在未读懂现有代码模式前发明新写法"
      enforcement: fail_closed
      note: "必须先查 L2 模块 wiki + 读懂现有代码，再写新代码"
      examples:
        - "AI 发明新模式 → 项目里独此一家"
        - "未通读完整方法就开始修改"

    - id: RL-C04
      title: 先模仿后发明
      description: "禁止 AI 发明新模式，必须模仿项目已有的代码风格"
      enforcement: fail_closed
      note: "参照 L2 模块 wiki 里的文件登记表，确认风格一致"
      examples:
        - "为同类功能发明不同的命名风格"
        - "不参考现有代码创建全新的工具类"

    - id: RL-C05
      title: 禁止修改受保护路径
      description: "dir-graph.yaml 中定义的 protected_paths 未批准不得修改"
      enforcement: fail_closed
      note: "涉及安全/认证/关键业务逻辑的路径必须人工审批"
      examples:
        - "修改 configs/ 下的配置文件"
        - "修改 .env 环境变量文件"
        - "修改 secrets/ 下的密钥文件"

    - id: RL-C06
      title: git commit 必须同步执行
      description: "git commit 后 git log -1 hash 更新是唯一成功证据"
      enforcement: fail_closed
      note: "长跑命令不靠 stdout 报告成功，全靠落盘文件"
      examples:
        - "长 commit 消息被 terminal 置后台 → AI 误判失败重提"

  standard:
    - id: RL-S01
      title: UI 改动必须比对语义桥
      description: "禁止硬编码字号/颜色，参照 L3 naming-conventions.md"
      enforcement: warn
      phase: implement
      note: "RL-C03 的具体化：UI 场景的特殊要求"
      examples:
        - "self.titleLabel.font = [UIFont systemFontOfSize:15]"
        - "self.titleLabel.textColor = [UIColor colorWithRed:0.1 green:0.1 blue:0.1 alpha:1.0]"

    - id: RL-S02
      title: 禁止语义联想扩大范围
      description: "拦截点必须有具体引用依据，禁止凭语义联想扩大改动范围"
      enforcement: warn
      phase: implement
      note: "允许的引用来源：设计稿标注(nodeId)、文档原文、用户原话"
      examples:
        - "用户说'点 A 拦截'，AI 联想'按一致性 B 也应该拦'，自作主张越界"

    - id: RL-S03
      title: 跨会话知识必须沉淀
      description: "每次需求开发后必须更新 TECH_SPEC.md"
      enforcement: warn
      phase: commit
      note: "这是让 AI 像团队成员一样工作的关键机制"
      examples:
        - "开发完成后直接 commit，没有更新 TECH_SPEC.md"

    - id: RL-S04
      title: 禁止遗漏设计稿
      description: "候选清单里每张设计稿都必须归宿明确，不允许'未归类'"
      enforcement: warn
      phase: breakdown
      note: "不允许用'参考图'当万能垃圾桶"
      examples:
        - "设计稿 9 张候选稿，AI 只挑 2 张做需求点"

    - id: RL-S05
      title: 视觉对齐必须逐项核对
      description: "UI 改动必须逐项核对数值，未对齐 ≥ 1 → FAIL"
      enforcement: warn
      phase: verify
      note: "container.height / icon size / title 字号等必须完全对齐"
      examples:
        - "设计稿说 280px，实际写的是 260px"

    - id: RL-S06
      title: 禁止 LLM 手工分桶
      description: "Figma 设计稿筛选必须用脚本直方图，禁止 LLM 凭手感分桶"
      enforcement: warn
      phase: breakdown
      note: "必须先跑 scan_figma_frames.py 出直方图，LLM 只能在已分桶基础上补判"
      examples:
        - "LLM 凭印象决定某张设计稿是否需要开发"

    - id: RL-S07
      title: 阶段内重试不超过 2 轮
      description: "模拟器验证阶段内重试不超过 2 轮"
      enforcement: warn
      phase: simulator
      note: "避免陷入无限重试循环"
      examples:
        - "同一问题重试超过 2 次仍然失败"

    - id: RL-S08
      title: 设计稿筛选必须用脚本
      description: "六类输入每类都有专用脚本通道，严禁通用 web_fetch"
      enforcement: warn
      phase: breakdown
      note: "不同数据源必须用对应的 MCP 或专用脚本"
      examples:
        - "企微文档用 wecom-cli，不用 web_fetch"
        - "TAPD 用 tapd_mcp_http，不用 web_fetch"
